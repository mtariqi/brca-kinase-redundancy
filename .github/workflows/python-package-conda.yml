name: Repository checks

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check Python syntax
        run: python -m compileall -q brca_pipeline.py brca_pipeline_bootstrap_pcs.py
      - name: Check linked findings document
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          result = Path("Results/TCGA_BRCA_RTK_NRTK_coexpression_2026-09.md")
          assert result.is_file(), f"Missing linked document: {result}"
          assert str(result) in readme, "README does not link to the findings"
          assert "1,224" in result.read_text(encoding="utf-8")
          PY
